apply plugin: 'com.android.application'

def rocketVersion = (project.findProperty('ROCKET_VERSION') ?: '1.0.1').toString()
def releaseParts = rocketVersion.split('[-+]')[0].split('\\.').collect { it.toInteger() }
if (releaseParts.size() != 3 || releaseParts.any { it < 0 || it > 99 }) {
    throw new GradleException('Rocket-R needs a three-part version with components from 0 to 99.')
}
def rocketVersionCode = releaseParts[0] * 10000 + releaseParts[1] * 100 + releaseParts[2]

android {
    namespace 'com.rocketret.rocketr'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.rocketret.rocketr'
        minSdk 24
        targetSdk 34
        versionCode rocketVersionCode
        versionName rocketVersion

        externalNativeBuild {
            cmake {
                // The pinned NDK r26 shared C++ runtime is only 4 KB aligned.
                // Link it into libmain so every packaged native library can
                // support both 4 KB and 16 KB Android devices.
                arguments '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a'
                targets 'RocketR'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
