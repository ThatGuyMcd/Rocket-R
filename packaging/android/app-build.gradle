apply plugin: 'com.android.application'

android {
    namespace 'com.rocketret.rocketr'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.rocketret.rocketr'
        minSdk 24
        targetSdk 34
        versionCode 10000
        versionName project.findProperty('ROCKET_VERSION') ?: '0.1.0-dev'

        externalNativeBuild {
            cmake {
                // The pinned NDK r26 shared C++ runtime is only 4 KB aligned.
                // Link it into libmain so every packaged native library can
                // support both 4 KB and 16 KB Android devices.
                arguments '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a'
                targets 'RocketR'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
